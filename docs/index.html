<!doctype html>
<html lang="sa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>बृहस्पतिः — पुस्तिका</title>
<meta property="og:image" content="media/brihaspati-demo-poster.png">
<meta name="description" content="बृहस्पतिः: संस्कृतयन्त्रस्य (Sassembly) पुस्तिकासाधनम्। कोष्ठः स्वयंसङ्कलितेन १.०.१ सङ्कलकेन सङ्कलितः; विचारके मूलचालने च समानं फलम्।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Tiro+Devanagari+Sanskrit&family=Tiro+Devanagari+Hindi&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="manifest" href="brand/site.webmanifest">
<meta name="theme-color" content="#f09a1e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#4a3412" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="assets/site.css">
<style>
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
  .bar input[type=text],.bar select{min-height:40px;font:inherit;padding:6px 10px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);color:var(--ink)}
  .bar input[type=text]{flex:1 1 220px}
  .cell{border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);margin:14px 0;box-shadow:var(--shadow-1)}
  .cell--note{background:transparent;border-style:dashed}
  .cbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule)}
  .cbar .num{flex:1;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3)}
  textarea{display:block;width:100%;box-sizing:border-box;border:0;background:transparent;color:var(--ink);padding:12px 14px;resize:vertical;font:inherit}
  textarea.src{font-family:"IBM Plex Mono",monospace;font-size:14px;line-height:1.55}
  .out{border-top:1px solid var(--rule);padding:8px 14px;font-family:"IBM Plex Mono",monospace;font-size:14px}
  .out .lab{font-size:12px;color:var(--ink-3)} .out pre{margin:4px 0;white-space:pre-wrap}
  .err{color:#B3261E;font-weight:600} .res{color:var(--ink-2)} .match{color:var(--teal);font-size:13px} .mismatch{color:#B3261E;font-weight:700;margin-top:6px}
  #stopnb[hidden]{display:none}
  .live{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3)} .badge{font-size:12px;border:1px solid var(--rule);border-radius:var(--r);padding:1px 6px;color:#B3261E}
  .detail{color:var(--ink-3);font-size:13px} #notice{color:#B3261E;margin:8px 0}
  .prose p{max-width:70ch} .md{padding:6px 14px 12px;border-top:1px dashed var(--rule)} .md table{margin:8px 0} .md blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--rule)}
  .pic{display:block;max-width:100%;max-height:260px;margin:6px 0;border:1px solid var(--rule);background:#fff} .embed{font-size:14px}
  .shell{display:grid;grid-template-columns:264px minmax(0,1fr);gap:28px;align-items:start}
  .shell.side-off{grid-template-columns:minmax(0,1fr)} .shell.side-off #side{display:none}
  #side{position:sticky;top:76px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-1);max-height:calc(100vh - 100px);display:flex;flex-direction:column;overflow:hidden}
  #side .shead{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--rule)}
  #side .shead h2{flex:1;margin:0;font:600 11.5px var(--mono);letter-spacing:0;color:var(--madder)}
  #side .shead .btn--sm{min-height:32px;padding:4px 10px;font-size:13.5px}
  #nblist{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
  #nblist li{display:flex;align-items:center;gap:2px;border-radius:var(--r);border-left:3px solid transparent}
  #nblist li:hover{background:var(--sunk)}
  #nblist li.cur{background:var(--madder-w);border-left-color:var(--madder)}
  #nblist .pick{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:8px 8px;cursor:pointer;min-height:44px}
  #nblist .nm{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #nblist .when{display:block;font:400 11.5px var(--mono);color:var(--ink-3)}
  #nblist .act{background:none;border:0;color:var(--ink-3);cursor:pointer;min-width:32px;min-height:44px;font-size:15px;border-radius:var(--r)}
  #nblist .act:hover{color:var(--ink);background:var(--rule)}
  #nblist input{flex:1;min-width:0;min-height:36px;margin:4px;font:inherit;padding:4px 8px;border:1px solid var(--madder);border-radius:var(--r);background:var(--surface);color:var(--ink)}
  #side .snote{margin:0;padding:8px 14px 10px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3)}
  #side .snote[hidden]{display:none}
  @media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}#side{position:static;max-height:46vh}.shell.side-off #side{display:none}}
  #sidetoggle[aria-expanded=true]{background:var(--madder-w)}
</style>
<script src="assets/theme.js"></script>
</head>
<body>
<header class="masthead">
  <div class="wrap masthead__in">
    <a class="brand" href="index.html"><span class="brand__deva">बृहस्पतिः</span><span class="brand__latin">Brihaspati</span></a>
    <span class="mark" aria-hidden="true">॥</span>
    <nav class="nav" aria-label="मुख्यम्">
      <a href="https://github.com/paramtatv/brihaspati">GitHub</a>
      <a href="https://paramtatv.github.io/sassembly/">संस्कृतयन्त्रम्</a>
    </nav>
    <label class="sr-only" for="lang">भाषा</label>
    <select class="langpick" id="lang"><option value="sa">संस्कृतम्</option><option value="en">English</option><option value="hi">हिन्दी</option></select>
    <button class="themetoggle" type="button" aria-pressed="false" aria-label="Switch to dark theme">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<main class="wrap" style="padding-top:20px;padding-bottom:40px">
  <p class="eyebrow">Sassembly v1.0.2 · .isas</p>
  <h1 class="sr-only">बृहस्पतिः</h1>
  <div class="shell" id="shell">
  <aside id="side" aria-label="Notebooks">
    <div class="shead"><h2 data-i18n="library">पुस्तिकाः</h2>
      <button class="btn btn--sm" id="newnb" type="button" data-i18n="new">नवम्</button>
      <button class="btn btn--sm" id="opennb" type="button" data-i18n="open">उद्घाटय</button></div>
    <ul id="nblist"></ul>
    <p class="snote" id="snote" hidden></p>
  </aside>
  <div class="nbmain">
  <div class="bar">
    <button class="btn btn--sm" id="sidetoggle" type="button" aria-expanded="true" aria-controls="side" data-i18n="library">पुस्तिकाः</button>
    <input type="text" id="title" aria-label="title" placeholder="…">
    <select id="examples" aria-label="examples"><option value="" data-i18n="examples">उदाहरणानि…</option></select>
    <button class="btn btn--sm" id="savenb" type="button" data-i18n="save">रक्ष</button>
    <button class="btn btn--solid btn--sm" id="runall" type="button" data-i18n="runall">सर्वं चालय</button>
    <button class="btn btn--sm" id="stopnb" type="button" data-i18n="stop" hidden>विरमय</button>
    <label class="embed"><input type="checkbox" id="embedall"> <span data-i18n="embedall">सर्वं निवेशय</span></label>
    <input type="file" id="file" multiple hidden>
  </div>
  <div id="notice" hidden></div>
  <div id="cells"></div>
  <p id="empty" data-i18n="empty" hidden>कोष्ठाः न सन्ति।</p>
  <div class="bar">
    <button class="btn btn--sm" id="addcode" type="button" data-i18n="addcode">+ कोष्ठः</button>
    <button class="btn btn--sm" id="addnote" type="button" data-i18n="addnote">+ टिप्पणी</button>
  </div>
  </div></div>
</main>
<footer class="foot"><div class="wrap foot__in">
  <span class="foot__deva">बृहस्पतिः</span><span class="foot__spacer">AGPL-3.0-only · commercial licence available</span>

  <a href="https://github.com/paramtatv/sassembly">paramtatv/sassembly</a>
  <a href="https://paramtatv.github.io/sassembly/">paramtatv.github.io/sassembly</a>
</div></footer>
<script type="module" src="app.mjs"></script>
</body>
</html>
